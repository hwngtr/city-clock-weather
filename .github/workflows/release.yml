name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GNOME and GLib tools
        run: sudo apt-get update && sudo apt-get install -y gnome-shell libglib2.0-bin
      - name: Check and package
        run: make package
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.shell-extension.zip --generate-notes
